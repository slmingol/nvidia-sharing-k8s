<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="860" height="150" role="img" aria-label="NVIDIA GPU Sharing on Kubernetes">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d26"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="860" height="150" rx="14" fill="url(#bgGrad)"/>
  <rect width="860" height="150" rx="14" fill="none" stroke="#2e3340" stroke-width="1.5"/>

  <!-- top accent line -->
  <rect x="14" y="0" width="200" height="2" rx="1" fill="url(#accentLine)" opacity="0.7"/>

  <!-- subtle grid pattern right side -->
  <g opacity="0.04" stroke="#76b900" stroke-width="1">
    <line x1="640" y1="0" x2="640" y2="150"/><line x1="680" y1="0" x2="680" y2="150"/>
    <line x1="720" y1="0" x2="720" y2="150"/><line x1="760" y1="0" x2="760" y2="150"/>
    <line x1="800" y1="0" x2="800" y2="150"/><line x1="840" y1="0" x2="840" y2="150"/>
    <line x1="620" y1="0" x2="860" y2="0"/><line x1="620" y1="37" x2="860" y2="37"/>
    <line x1="620" y1="75" x2="860" y2="75"/><line x1="620" y1="112" x2="860" y2="112"/>
    <line x1="620" y1="150" x2="860" y2="150"/>
  </g>

  <!-- GPU CHIP (28, 22) — 96×106 -->
  <rect x="28" y="22" width="96" height="106" rx="8" fill="url(#chipGrad)" stroke="#76b900" stroke-width="1.8"/>

  <!-- die grid 4×4 -->
  <rect x="38" y="32" width="18" height="18" rx="2.5" fill="#76b900" opacity="0.90" filter="url(#glow)"/>
  <rect x="60" y="32" width="18" height="18" rx="2.5" fill="#76b900" opacity="0.60"/>
  <rect x="82" y="32" width="18" height="18" rx="2.5" fill="#76b900" opacity="0.35"/>
  <rect x="104" y="32" width="11" height="18" rx="2.5" fill="#76b900" opacity="0.20"/>

  <rect x="38" y="54" width="18" height="18" rx="2.5" fill="#76b900" opacity="0.60"/>
  <rect x="60" y="54" width="18" height="18" rx="2.5" fill="#76b900" opacity="0.90" filter="url(#glow)"/>
  <rect x="82" y="54" width="18" height="18" rx="2.5" fill="#76b900" opacity="0.60"/>
  <rect x="104" y="54" width="11" height="18" rx="2.5" fill="#76b900" opacity="0.35"/>

  <rect x="38" y="76" width="18" height="18" rx="2.5" fill="#76b900" opacity="0.35"/>
  <rect x="60" y="76" width="18" height="18" rx="2.5" fill="#76b900" opacity="0.60"/>
  <rect x="82" y="76" width="18" height="18" rx="2.5" fill="#76b900" opacity="0.90" filter="url(#glow)"/>
  <rect x="104" y="76" width="11" height="18" rx="2.5" fill="#76b900" opacity="0.60"/>

  <rect x="38" y="98" width="18" height="22" rx="2.5" fill="#76b900" opacity="0.20"/>
  <rect x="60" y="98" width="18" height="22" rx="2.5" fill="#76b900" opacity="0.35"/>
  <rect x="82" y="98" width="18" height="22" rx="2.5" fill="#76b900" opacity="0.60"/>
  <rect x="104" y="98" width="11" height="22" rx="2.5" fill="#76b900" opacity="0.90" filter="url(#glow)"/>

  <!-- pins left -->
  <line x1="18" y1="40" x2="28" y2="40" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="56" x2="28" y2="56" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="72" x2="28" y2="72" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="88" x2="28" y2="88" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="104" x2="28" y2="104" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <!-- pins right -->
  <line x1="124" y1="40" x2="134" y2="40" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="124" y1="56" x2="134" y2="56" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="124" y1="72" x2="134" y2="72" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="124" y1="88" x2="134" y2="88" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="124" y1="104" x2="134" y2="104" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <!-- pins bottom -->
  <line x1="47" y1="128" x2="47" y2="138" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="128" x2="65" y2="138" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="83" y1="128" x2="83" y2="138" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="101" y1="128" x2="101" y2="138" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="119" y1="128" x2="119" y2="138" stroke="#3d4455" stroke-width="2.5" stroke-linecap="round"/>

  <!-- green glow behind chip -->
  <rect x="28" y="22" width="96" height="106" rx="8" fill="#76b900" opacity="0.04" filter="url(#glowSoft)"/>

  <!-- divider -->
  <line x1="158" y1="28" x2="158" y2="122" stroke="#2e3340" stroke-width="1.5"/>

  <!-- NVIDIA pill -->
  <rect x="172" y="26" width="72" height="22" rx="4" fill="#76b900" opacity="0.18" stroke="#76b900" stroke-width="1" stroke-opacity="0.55"/>
  <text x="208" y="41" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" fill="#76b900" text-anchor="middle" letter-spacing="0.07em">NVIDIA</text>

  <!-- main title -->
  <text x="172" y="88" font-family="system-ui,sans-serif" font-size="38" font-weight="700" fill="#e8edf5" letter-spacing="-0.02em">GPU Sharing</text>

  <!-- subtitle row -->
  <text x="174" y="114" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" fill="#5e6a7a" letter-spacing="0.03em">on </text>
  <text x="204" y="114" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" fill="#76b900" letter-spacing="0.03em" font-weight="500">Kubernetes</text>
  <text x="318" y="114" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" fill="#3d4455" letter-spacing="0.03em"> · Reference Guide</text>

  <!-- K8s wheel, right -->
  <g transform="translate(790,75)" opacity="0.22">
    <circle r="34" fill="none" stroke="#76b900" stroke-width="2"/>
    <circle r="10" fill="none" stroke="#76b900" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="-32" stroke="#76b900" stroke-width="2" stroke-linecap="round"/>
    <line x1="11" y1="-6" x2="27.7" y2="-16" stroke="#76b900" stroke-width="2" stroke-linecap="round"/>
    <line x1="11" y1="6" x2="27.7" y2="16" stroke="#76b900" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="0" y2="32" stroke="#76b900" stroke-width="2" stroke-linecap="round"/>
    <line x1="-11" y1="6" x2="-27.7" y2="16" stroke="#76b900" stroke-width="2" stroke-linecap="round"/>
    <line x1="-11" y1="-6" x2="-27.7" y2="-16" stroke="#76b900" stroke-width="2" stroke-linecap="round"/>
    <line x1="-1.5" y1="-11.8" x2="-4" y2="-30" stroke="#76b900" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
