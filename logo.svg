<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 110" width="580" height="110" role="img" aria-label="NVIDIA GPU Sharing on Kubernetes">
  <defs>
    <!-- dark panel always — works as a badge on any GitHub bg -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161921"/>
      <stop offset="100%" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background panel -->
  <rect width="580" height="110" rx="12" fill="url(#bgGrad)"/>
  <rect width="580" height="110" rx="12" fill="none" stroke="#2a2f3a" stroke-width="1"/>

  <!-- accent top-left corner line -->
  <path d="M0 30 Q0 12 12 12" fill="none" stroke="#76b900" stroke-width="1.5" opacity="0.6"/>

  <!-- GPU CHIP ICON (22,18) 68×74 -->
  <!-- chip body -->
  <rect x="22" y="18" width="68" height="74" rx="6" fill="url(#chipGrad)" stroke="#76b900" stroke-width="1.5"/>

  <!-- inner die grid: 3×3 cells representing GPU partitions/MIG -->
  <rect x="30" y="26" width="16" height="16" rx="2" fill="#76b900" opacity="0.85" filter="url(#glow)"/>
  <rect x="50" y="26" width="16" height="16" rx="2" fill="#76b900" opacity="0.55"/>
  <rect x="66" y="26" width="16" height="16" rx="2" fill="#76b900" opacity="0.30"/>
  <rect x="30" y="46" width="16" height="16" rx="2" fill="#76b900" opacity="0.55"/>
  <rect x="50" y="46" width="16" height="16" rx="2" fill="#76b900" opacity="0.85" filter="url(#glow)"/>
  <rect x="66" y="46" width="16" height="16" rx="2" fill="#76b900" opacity="0.30"/>
  <rect x="30" y="66" width="16" height="16" rx="2" fill="#76b900" opacity="0.30"/>
  <rect x="50" y="66" width="16" height="16" rx="2" fill="#76b900" opacity="0.55"/>
  <rect x="66" y="66" width="16" height="16" rx="2" fill="#76b900" opacity="0.85" filter="url(#glow)"/>

  <!-- chip pins left -->
  <line x1="14" y1="32" x2="22" y2="32" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="46" x2="22" y2="46" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="60" x2="22" y2="60" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="74" x2="22" y2="74" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <!-- chip pins right -->
  <line x1="90" y1="32" x2="98" y2="32" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="46" x2="98" y2="46" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="60" x2="98" y2="60" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="74" x2="98" y2="74" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <!-- chip pins bottom -->
  <line x1="38" y1="92" x2="38" y2="98" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="92" x2="52" y2="98" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="92" x2="66" y2="98" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="92" x2="80" y2="98" stroke="#4a5260" stroke-width="2" stroke-linecap="round"/>

  <!-- divider -->
  <line x1="112" y1="22" x2="112" y2="88" stroke="#2a2f3a" stroke-width="1"/>

  <!-- NVIDIA badge -->
  <rect x="124" y="20" width="60" height="18" rx="3" fill="#76b900" opacity="0.15" stroke="#76b900" stroke-width="0.75" stroke-opacity="0.5"/>
  <text x="154" y="32" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" font-weight="600" fill="#76b900" text-anchor="middle" letter-spacing="0.06em">NVIDIA</text>

  <!-- main title -->
  <text x="124" y="62" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="26" font-weight="600" fill="#e6edf3" letter-spacing="-0.01em">GPU Sharing</text>

  <!-- subtitle -->
  <text x="124" y="83" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#8b9299" letter-spacing="0.02em">on </text>
  <text x="147" y="83" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#76b900" letter-spacing="0.02em">Kubernetes</text>

  <!-- K8s wheel (right side decoration) -->
  <g transform="translate(522,55)" opacity="0.18">
    <circle r="20" fill="none" stroke="#76b900" stroke-width="1.5"/>
    <circle r="6" fill="none" stroke="#76b900" stroke-width="1.5"/>
    <!-- 7 spokes -->
    <line x1="0" y1="-7" x2="0" y2="-19" stroke="#76b900" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6.6" y1="-3.5" x2="16.7" y2="-8.9" stroke="#76b900" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6.6" y1="3.5" x2="16.7" y2="8.9" stroke="#76b900" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="7" x2="0" y2="19" stroke="#76b900" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-6.6" y1="3.5" x2="-16.7" y2="8.9" stroke="#76b900" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-6.6" y1="-3.5" x2="-16.7" y2="-8.9" stroke="#76b900" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-0.9" y1="-6.9" x2="-2.3" y2="-17.5" stroke="#76b900" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
