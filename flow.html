<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Sharing Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0d0f14;
  --surface: #161921;
  --surface2: #1e222d;
  --border: #2a2f3d;
  --fg: #e2e8f0;
  --fg-muted: #7a8499;
  --accent: #76b900;
  --accent-dim: rgba(118,185,0,0.18);
  --orange: #f0a500;
  --orange-dim: rgba(240,165,0,0.15);
  --blue: #6888ff;
  --blue-dim: rgba(104,136,255,0.15);
  --red: #e05252;
  --red-dim: rgba(224,82,82,0.15);
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column}

/* ── header ── */
.hdr{
  display:flex;align-items:center;gap:12px;padding:10px 20px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-wrap:wrap;position:sticky;top:0;z-index:100;
}
.hdr-title{font-size:13px;font-weight:700;color:var(--fg);letter-spacing:.03em;margin-right:4px;white-space:nowrap}
.hdr-title span{color:var(--accent)}
.wl-tabs{display:flex;gap:4px}
.wl-btn{
  padding:5px 12px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--fg-muted);
  transition:all .15s;font-family:inherit;white-space:nowrap;
}
.wl-btn:hover{border-color:var(--fg-muted);color:var(--fg)}
.wl-btn.active-audio{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.wl-btn.active-llmsm{background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}
.wl-btn.active-llmlg{background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.sim-btn{
  padding:5px 14px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent-dim);color:var(--accent);
  transition:all .15s;font-family:inherit;
}
.sim-btn:hover{background:var(--accent);color:#000}
.sim-btn:disabled{opacity:.4;cursor:not-allowed}
.tel-btn{
  padding:5px 12px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--fg-muted);
  transition:all .15s;font-family:inherit;
}
.tel-btn.on{background:var(--orange-dim);border-color:var(--orange);color:var(--orange)}
.status-bar{
  margin-left:auto;font-size:11px;color:var(--fg-muted);
  font-family:'IBM Plex Mono',monospace;background:var(--surface2);
  border:1px solid var(--border);border-radius:5px;padding:4px 10px;
  white-space:nowrap;
}

/* ── canvas ── */
.canvas-wrap{flex:1;overflow:auto;padding:0;position:relative}
.canvas-wrap svg{display:block;min-width:900px;width:100%;height:auto}

/* ── SVG element classes ── */
.lane-bg-mgmt{fill:rgba(118,185,0,0.03)}
.lane-bg-data{fill:rgba(104,136,255,0.02)}
.lane-bg-obs{fill:rgba(240,165,0,0.03)}
.lane-label{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:var(--fg-muted,#7a8499);letter-spacing:.12em;text-transform:uppercase;opacity:.7}

/* nodes */
.node{cursor:pointer;transition:opacity .2s}
.node:hover .node-rect{filter:brightness(1.15)}
.node-rect{stroke-width:1.5;rx:6}
.node-rect-mgmt{fill:#1a1f2a;stroke:#76b900}
.node-rect-data{fill:#1a1f2a;stroke:#445}
.node-rect-triton{fill:#1e1a10;stroke:#f0a500}
.node-rect-llm{fill:#14182a;stroke:#6888ff}
.node-rect-gpu{fill:#111a0a;stroke:#76b900;stroke-width:2}
.node-rect-obs{fill:#1a1510;stroke:#f0a500;stroke-width:1.5}
.node-rect-alert{fill:#1a1010;stroke:#e05252;stroke-width:1.5}
.node-rect-turn{fill:#141820;stroke:#6888ff;stroke-dasharray:4 2}
.node-rect-client{fill:#161921;stroke:#445}
.node-label{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:11px;font-weight:600;fill:#e2e8f0;text-anchor:middle;pointer-events:none}
.node-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:#7a8499;text-anchor:middle;pointer-events:none}
.node-sub-accent{fill:#76b900}
.node-sub-orange{fill:#f0a500}
.node-sub-blue{fill:#6888ff}

/* arrows */
.arrow{fill:none;stroke:#2a2f3d;stroke-width:1.5;marker-end:url(#arr-dim)}
.arrow-mgmt{stroke:#76b900;opacity:.4;marker-end:url(#arr-green)}
.arrow-obs{stroke:#f0a500;opacity:.3;marker-end:url(#arr-orange)}
.arrow-vert{stroke:#2a2f3d;stroke-dasharray:3 3;opacity:.4;marker-end:url(#arr-dim)}

/* active/dim states */
.node.dimmed{opacity:.2}
.arrow.dimmed{opacity:.05}
.arrow.active-path{stroke-width:2.5;opacity:1;stroke-dasharray:6 3;animation:dashflow 1s linear infinite}
.arrow.active-path-audio{stroke:#76b900;marker-end:url(#arr-green)}
.arrow.active-path-llm{stroke:#6888ff;marker-end:url(#arr-blue)}
.node.active-node .node-rect-mgmt,.node.active-node .node-rect-data,.node.active-node .node-rect-gpu{filter:brightness(1.3) drop-shadow(0 0 6px rgba(118,185,0,.5))}
.node.active-node .node-rect-triton{filter:brightness(1.3) drop-shadow(0 0 6px rgba(240,165,0,.5))}
.node.active-node .node-rect-llm{filter:brightness(1.3) drop-shadow(0 0 6px rgba(104,136,255,.5))}

/* telemetry active */
.arrow.tel-active{stroke:#f0a500;stroke-width:2;opacity:.9;marker-end:url(#arr-orange);animation:dashflow .8s linear infinite}
.node.tel-active .node-rect-obs,.node.tel-active .node-rect-alert{filter:brightness(1.4) drop-shadow(0 0 5px rgba(240,165,0,.5))}

@keyframes dashflow{to{stroke-dashoffset:-18}}

/* MIG bars inside GPU */
.mig-bar-bg{fill:#0d1a04;rx:2}
.mig-bar{rx:2;transition:opacity .3s}
.mig-bar-1g{fill:#3a5c00}
.mig-bar-2g{fill:#4a7200}
.mig-bar-3g{fill:#5a8a00}
.mig-bar.active-slice{fill:#76b900;filter:drop-shadow(0 0 4px #76b900)}
.mig-label{font-family:'IBM Plex Mono',monospace;font-size:8px;fill:#7a8499;dominant-baseline:middle;pointer-events:none}
.mig-label-active{fill:#76b900}

/* simulate packet */
.packet{r:5;fill:#76b900;filter:drop-shadow(0 0 5px #76b900);opacity:0;pointer-events:none}
.packet-llm{fill:#6888ff;filter:drop-shadow(0 0 5px #6888ff)}

/* detail panel */
.detail{
  position:fixed;top:0;right:0;bottom:0;width:380px;max-width:95vw;
  background:var(--surface);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;z-index:200;overflow:hidden;
}
.detail.open{transform:translateX(0)}
.detail-hdr{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.detail-icon{
  width:32px;height:32px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:15px;flex-shrink:0;
}
.detail-title{font-size:14px;font-weight:700;flex:1}
.detail-sub{font-size:11px;color:var(--fg-muted);font-family:'IBM Plex Mono',monospace}
.detail-close{
  width:28px;height:28px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;border:1px solid var(--border);
  background:transparent;color:var(--fg-muted);font-size:16px;line-height:1;
  transition:all .15s;flex-shrink:0;
}
.detail-close:hover{background:var(--surface2);color:var(--fg)}
.detail-body{flex:1;overflow-y:auto;padding:16px}
.detail-body p,.detail-body li{font-size:12.5px;line-height:1.6;color:var(--fg-muted);margin-bottom:8px}
.detail-body strong{color:var(--fg)}
.detail-body ul{padding-left:16px;margin-bottom:10px}
.detail-section{margin-bottom:16px}
.detail-section-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
pre.detail-code{
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  line-height:1.55;overflow-x:auto;white-space:pre;color:#c9d3e0;margin-bottom:10px;
}
pre.detail-code .k{color:#76b900}
pre.detail-code .v{color:#a8d070}
pre.detail-code .c{color:#4a5568;font-style:italic}
pre.detail-code .s{color:#f0a500}
pre.detail-code .n{color:#6888ff}
.metric-row{display:flex;gap:6px;align-items:baseline;margin-bottom:5px}
.metric-name{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent);flex:1}
.metric-desc{font-size:11px;color:var(--fg-muted)}
.mig-detail-bar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mig-detail-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.mig-detail-info{font-size:11px}
.mig-detail-name{font-weight:700;color:var(--accent);font-family:'IBM Plex Mono',monospace}
.mig-detail-desc{color:var(--fg-muted)}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;font-family:'IBM Plex Mono',monospace;margin:2px}
.tag-green{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(118,185,0,.3)}
.tag-blue{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(104,136,255,.3)}
.tag-orange{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(240,165,0,.3)}
a.ext-link{color:var(--blue);text-decoration:none;font-size:12px}
a.ext-link:hover{text-decoration:underline}

/* overlay (click-outside to close detail) */
.overlay{position:fixed;inset:0;z-index:190;display:none}
.overlay.open{display:block}

/* legend */
.legend{display:flex;gap:16px;padding:8px 20px;border-top:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-muted)}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
</style>
</head>
<body>

<div class="hdr">
  <span class="hdr-title"><span>GPU Sharing</span> — Interactive Flow</span>
  <div class="hdr-sep"></div>
  <div class="wl-tabs">
    <button class="wl-btn active-audio" id="wl-audio" onclick="selectWorkload('audio')">Audio (Whisper)</button>
    <button class="wl-btn" id="wl-llmsm" onclick="selectWorkload('llmsm')">LLM 8B</button>
    <button class="wl-btn" id="wl-llmlg" onclick="selectWorkload('llmlg')">LLM 22B</button>
  </div>
  <div class="hdr-sep"></div>
  <button class="sim-btn" id="sim-btn" onclick="simulate()">▶ Simulate Request</button>
  <button class="tel-btn" id="tel-btn" onclick="toggleTelemetry()">Telemetry</button>
  <div class="status-bar" id="status-bar">workload: whisper · slice: 1g.10gb · vram: 10 GB · model: whisper-large-v3</div>
</div>

<div class="canvas-wrap">
<svg id="diagram" viewBox="0 0 1110 560" role="img" aria-label="GPU Sharing Architecture Flow — three swimlanes showing management, data, and observability planes">
  <defs>
    <marker id="arr-dim" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#2a2f3d"/></marker>
    <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#76b900"/></marker>
    <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#f0a500"/></marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#6888ff"/></marker>
  </defs>

  <!-- swimlane backgrounds -->
  <rect class="lane-bg-mgmt" x="0" y="0" width="1110" height="130"/>
  <rect class="lane-bg-data" x="0" y="130" width="1110" height="320"/>
  <rect class="lane-bg-obs" x="0" y="450" width="1110" height="110"/>

  <!-- lane dividers -->
  <line x1="0" y1="130" x2="1110" y2="130" stroke="#2a2f3d" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="0" y1="450" x2="1110" y2="450" stroke="#2a2f3d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- lane labels -->
  <text class="lane-label" x="12" y="20">Management</text>
  <text class="lane-label" x="12" y="150">Data / User Journey</text>
  <text class="lane-label" x="12" y="468">Observability</text>

  <!-- ═══════════════════════════════════════════ MANAGEMENT ARROWS ═══ -->
  <path id="arr-argocd-gpuop" class="arrow arrow-mgmt" d="M185,68 L245,68" marker-end="url(#arr-green)"/>
  <text x="215" y="62" font-family="IBM Plex Mono" font-size="8" fill="#3a5020" text-anchor="middle">deploys</text>
  <path id="arr-gpuop-migmgr" class="arrow arrow-mgmt" d="M385,68 L445,68" marker-end="url(#arr-green)"/>
  <text x="415" y="62" font-family="IBM Plex Mono" font-size="8" fill="#3a5020" text-anchor="middle">manages</text>
  <path id="arr-gpuop-nfd" class="arrow" d="M385,82 Q415,100 445,100" marker-end="url(#arr-dim)" stroke-dasharray="3 2" opacity=".3"/>

  <!-- ═══════════════════════════════════════════ MANAGEMENT NODES ═══ -->
  <!-- ArgoCD -->
  <g class="node" id="node-argocd" onclick="showDetail('argocd')">
    <rect class="node-rect node-rect-mgmt" x="65" y="44" width="120" height="48" rx="6"/>
    <text class="node-label" x="125" y="65">ArgoCD</text>
    <text class="node-sub node-sub-accent" x="125" y="80">GitOps deploy</text>
  </g>
  <!-- GPU Operator -->
  <g class="node" id="node-gpuop" onclick="showDetail('gpuop')">
    <rect class="node-rect node-rect-mgmt" x="245" y="44" width="140" height="48" rx="6"/>
    <text class="node-label" x="315" y="65">GPU Operator</text>
    <text class="node-sub node-sub-accent" x="315" y="80">v24.9.2</text>
  </g>
  <!-- MIG Manager -->
  <g class="node" id="node-migmgr" onclick="showDetail('migmgr')">
    <rect class="node-rect node-rect-mgmt" x="445" y="44" width="130" height="48" rx="6"/>
    <text class="node-label" x="510" y="65">MIG Manager</text>
    <text class="node-sub node-sub-accent" x="510" y="80">DaemonSet</text>
  </g>
  <!-- NFD (small, dimmed) -->
  <g class="node" id="node-nfd" onclick="showDetail('nfd')">
    <rect class="node-rect" x="445" y="100" width="130" height="26" rx="5" fill="#131820" stroke="#333" stroke-width="1"/>
    <text class="node-label" x="510" y="117" font-size="9" fill="#4a5568">Node Feature Discovery</text>
  </g>

  <!-- vertical lines: MIG Manager → GPU (dashed) -->
  <line id="arr-migmgr-gpu" x1="510" y1="92" x2="510" y2="130" stroke="#76b900" stroke-width="1" stroke-dasharray="3 3" opacity=".3"/>

  <!-- ═══════════════════════════════════════════ DATA PLANE ARROWS ═══ -->
  <!-- Client → OCP Svc -->
  <path id="arr-client-ocpsvc" class="arrow" d="M118,290 L180,290" marker-end="url(#arr-dim)"/>
  <!-- Client → Turnstone (dashed optional) -->
  <path id="arr-client-turn" class="arrow" d="M118,310 Q150,340 183,340" marker-end="url(#arr-dim)" stroke-dasharray="4 2" opacity=".25"/>
  <!-- Turnstone → OCP Svc -->
  <path id="arr-turn-ocpsvc" class="arrow" d="M293,340 Q320,340 340,310" marker-end="url(#arr-dim)" stroke-dasharray="4 2" opacity=".25"/>
  <!-- OCP Svc → Triton pods (fan out) -->
  <path id="arr-ocpsvc-t1" class="arrow" d="M430,276 Q510,230 548,220" marker-end="url(#arr-dim)"/>
  <path id="arr-ocpsvc-t2" class="arrow" d="M430,282 Q510,268 548,268" marker-end="url(#arr-dim)"/>
  <path id="arr-ocpsvc-t3" class="arrow" d="M430,296 Q510,306 548,316" marker-end="url(#arr-dim)"/>
  <path id="arr-ocpsvc-t4" class="arrow" d="M430,302 Q510,342 548,362" marker-end="url(#arr-dim)"/>
  <!-- Triton → MIG slices -->
  <path id="arr-t1-mig1" class="arrow" d="M668,220 L718,213" marker-end="url(#arr-dim)"/>
  <path id="arr-t2-mig2" class="arrow" d="M668,268 L718,250" marker-end="url(#arr-dim)"/>
  <path id="arr-t3-mig3" class="arrow" d="M668,316 L718,305" marker-end="url(#arr-dim)"/>
  <path id="arr-t4-mig4" class="arrow" d="M668,362 L718,370" marker-end="url(#arr-dim)"/>
  <!-- Response path (dashed, back) -->
  <path id="arr-resp" class="arrow" d="M718,440 Q400,440 120,310" stroke-dasharray="3 3" opacity=".15" marker-end="url(#arr-dim)"/>

  <!-- ═══════════════════════════════════════════ DATA NODES ═══ -->
  <!-- Client -->
  <g class="node" id="node-client" onclick="showDetail('client')">
    <rect class="node-rect node-rect-client" x="40" y="258" width="80" height="64" rx="6"/>
    <text class="node-label" x="80" y="283">Client</text>
    <text class="node-sub" x="80" y="297">audio stream</text>
    <text class="node-sub" x="80" y="310">/ LLM prompt</text>
  </g>
  <!-- Turnstone (optional) -->
  <g class="node" id="node-turnstone" onclick="showDetail('turnstone')">
    <rect class="node-rect node-rect-turn" x="183" y="318" width="110" height="44" rx="6"/>
    <text class="node-label" x="238" y="336" fill="#6888ff">Turnstone</text>
    <text class="node-sub node-sub-blue" x="238" y="351">agent loop (opt.)</text>
  </g>
  <!-- OCP Service -->
  <g class="node" id="node-ocpsvc" onclick="showDetail('ocpsvc')">
    <rect class="node-rect node-rect-data" x="310" y="264" width="120" height="52" rx="6"/>
    <text class="node-label" x="370" y="285">OCP Service</text>
    <text class="node-sub" x="370" y="300">ClusterIP</text>
    <text class="node-sub" x="370" y="312">gRPC :8001</text>
  </g>
  <!-- Triton pods -->
  <g class="node" id="node-t1" onclick="showDetail('triton-audio')">
    <rect class="node-rect node-rect-triton" x="548" y="198" width="120" height="44" rx="6"/>
    <text class="node-label" x="608" y="217">Triton</text>
    <text class="node-sub node-sub-orange" x="608" y="231">whisper #1</text>
  </g>
  <g class="node" id="node-t2" onclick="showDetail('triton-audio')">
    <rect class="node-rect node-rect-triton" x="548" y="246" width="120" height="44" rx="6"/>
    <text class="node-label" x="608" y="265">Triton</text>
    <text class="node-sub node-sub-orange" x="608" y="279">whisper #2</text>
  </g>
  <g class="node" id="node-t3" onclick="showDetail('triton-llmsm')">
    <rect class="node-rect node-rect-llm" x="548" y="294" width="120" height="44" rx="6"/>
    <text class="node-label" x="608" y="313">Triton</text>
    <text class="node-sub node-sub-blue" x="608" y="327">vLLM 8B</text>
  </g>
  <g class="node" id="node-t4" onclick="showDetail('triton-llmlg')">
    <rect class="node-rect node-rect-llm" x="548" y="342" width="120" height="44" rx="6"/>
    <text class="node-label" x="608" y="361">Triton</text>
    <text class="node-sub node-sub-blue" x="608" y="375">vLLM 22B</text>
  </g>

  <!-- ═══════════════════════════════════════════ A100 GPU NODE ═══ -->
  <g class="node" id="node-gpu" onclick="showDetail('gpu')">
    <rect class="node-rect node-rect-gpu" x="718" y="155" width="200" height="280" rx="8"/>
    <text class="node-label node-sub-accent" x="818" y="174" font-size="10">A100-80GB</text>
    <text class="node-sub" x="818" y="187" font-size="8">MIG enabled · mixed strategy</text>

    <!-- MIG slice bars (proportional: total 80GB) -->
    <!-- 1g.10gb #1 — 10/80 = 12.5% → 22px wide out of 176 -->
    <text class="mig-label" id="mig-lbl-1" x="730" y="213">1g.10gb</text>
    <rect class="mig-bar-bg" x="730" y="202" width="176" height="18" rx="2"/>
    <rect class="mig-bar mig-bar-1g" id="mig-bar-1" x="730" y="202" width="22" height="18" rx="2"/>
    <text class="mig-label" x="756" y="213" dominant-baseline="middle">10 GB</text>

    <!-- 1g.10gb #2 -->
    <text class="mig-label" id="mig-lbl-2" x="730" y="233">1g.10gb</text>
    <rect class="mig-bar-bg" x="730" y="222" width="176" height="18" rx="2"/>
    <rect class="mig-bar mig-bar-1g" id="mig-bar-2" x="730" y="222" width="22" height="18" rx="2"/>
    <text class="mig-label" x="756" y="233" dominant-baseline="middle">10 GB</text>

/* ── workload selector ── */
function selectWorkload(wl) {
  activeWorkload = wl;
  const wlData = WORKLOADS[wl];
  // update buttons
  ['audio','llmsm','llmlg'].forEach(w => {
    const btn = document.getElementById('wl-'+w);
    btn.className = 'wl-btn' + (w===wl ? ' '+WORKLOADS[w].class : '');
  });
  document.getElementById('status-bar').textContent = wlData.statusText;
  applyHighlight(wlData);
}

function applyHighlight(wlData) {
  const svg = document.getElementById('diagram');
  // reset all nodes
  svg.querySelectorAll('.node').forEach(n => {
    n.classList.remove('dimmed','active-node');
  });
  // reset all arrows
  svg.querySelectorAll('.arrow').forEach(a => {
    a.classList.remove('dimmed','active-path','active-path-audio','active-path-llm');
  });
  // reset mig bars
  for(let i=1;i<=4;i++){
    const b = document.getElementById('mig-bar-'+i);
    if(b) b.classList.remove('active-slice');
    const l = document.getElementById('mig-lbl-'+i);
    if(l) l.classList.remove('mig-label-active');
  }
  // apply active
  wlData.activeNodes.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.add('active-node');
  });
  wlData.dimNodes.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.add('dimmed');
  });
  wlData.activeArrows.forEach(id => {
    const el = document.getElementById(id);
    if(el){
      el.classList.add('active-path');
      el.classList.add(activeWorkload==='audio'?'active-path-audio':'active-path-llm');
    }
  });
  wlData.dimArrows.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.add('dimmed');
  });
  wlData.activeMigBars.forEach(i => {
    const b = document.getElementById('mig-bar-'+i);
    if(b) b.classList.add('active-slice');
    const l = document.getElementById('mig-lbl-'+i);
    if(l) l.classList.add('mig-label-active');
  });
}

/* ── simulation ── */
function simulate() {
  if(simRunning) return;
  simRunning = true;
  const btn = document.getElementById('sim-btn');
  btn.disabled = true;
  btn.textContent = '⟳ Running…';

  const wlData = WORKLOADS[activeWorkload];
  const pathEl = document.getElementById(wlData.pathId);
  const packet = document.getElementById('packet');
  const totalLen = pathEl.getTotalLength ? pathEl.getTotalLength() : 400;

  packet.className = 'packet' + (activeWorkload==='audio' ? '' : ' packet-llm');
  packet.style.opacity = '1';

  let startTime = null;
  const duration = 1600;

  function step(ts) {
    if(!startTime) startTime = ts;
    const progress = Math.min((ts - startTime) / duration, 1);
    // ease in-out
    const ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
    const point = pathEl.getPointAtLength(ease * totalLen);
    packet.setAttribute('cx', point.x);
    packet.setAttribute('cy', point.y);
    if(progress < 1){
      requestAnimationFrame(step);
    } else {
      // pulse on GPU, then return
      packet.style.opacity = '0.6';
      setTimeout(() => {
        packet.style.opacity = '0';
        btn.disabled = false;
        btn.textContent = '▶ Simulate Request';
        simRunning = false;
      }, 600);
    }
  }
  requestAnimationFrame(step);
}

/* ── telemetry toggle ── */
function toggleTelemetry() {
  telemetryOn = !telemetryOn;
  const btn = document.getElementById('tel-btn');
  btn.className = 'tel-btn' + (telemetryOn ? ' on' : '');
  btn.textContent = telemetryOn ? '◉ Telemetry' : 'Telemetry';
  const svg = document.getElementById('diagram');
  const telNodes = ['node-dcgm','node-prom','node-graf'];
  const telArrows = ['arr-gpu-dcgm','arr-dcgm-prom','arr-prom-graf','arr-prom-graf2'];
  telNodes.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.toggle('tel-active', telemetryOn);
  });
  telArrows.forEach(id => {
    const el = document.getElementById(id);
    if(el){
      el.classList.toggle('tel-active', telemetryOn);
      if(telemetryOn) el.classList.remove('dimmed');
    }
  });
}

function showDetail(id) {
  const d = DETAILS[id];
  if(!d) return;
  document.getElementById('d-icon').textContent = d.icon;
  document.getElementById('d-icon').style.background = d.iconBg;
  document.getElementById('d-title').textContent = d.title;
  document.getElementById('d-sub').textContent = d.sub;
  document.getElementById('d-body').innerHTML = d.body;
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
